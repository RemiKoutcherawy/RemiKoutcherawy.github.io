  <style>
    :root { --split: 100%; }
    /* noinspection CssUnusedSymbol -- class toggled dynamically as `${btn.dataset.ui}-open` */
    body.command-area-open { --split: 80%; }
    /* noinspection CssUnusedSymbol -- #overlay is a canvas created at runtime by View3d.js */
    #canvas3d,#overlay{position:absolute;top:0;left:0;width:100%;height:var(--split)}
    #canvas3d{border:1px solid black}
    /* Touch screens: the canvases handle their own gestures, the browser must not
       scroll, pinch-zoom, double-tap-zoom or select text on them (iPad Safari) */
    #canvas2d,#canvas3d,#overlay{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
    #overlay{z-index:1}
    #canvas2d{display:none;position:absolute;top:0;left:0;width:50%;height:var(--split);border:1px solid black}
    body.view2d-open #canvas2d{display:block}
    body.view2d-open #canvas3d,body.view2d-open #overlay{left:50%;width:50%}
    #commandAreaPanel{
      display:none;position:absolute;width:100%;left:0;bottom:0;
      height:calc(100% - var(--split));box-sizing:border-box;
      padding:4px 8px;background:#f6f8fa;border-top:1px solid black;
      flex-direction:column;z-index:5
    }
    body.command-area-open #commandAreaPanel{display:flex}
    #commandAreaPanel label{font:14px sans-serif;margin-bottom:4px}
    #commandArea{flex:1;width:100%;font:14px monospace;resize:none}
    #burger,#nav,#undoBtn,#runBtn,#stepBtn{position:absolute;left:8px;z-index:10;background:#f6f8fa;border:1px solid black;border-radius:6px}
    #burger{top:8px;padding:8px;line-height:0;cursor:pointer}
    #burger:hover{background:#eef1f4}
    #undoBtn{top:8px;left:54px;padding:8px;line-height:0;cursor:pointer}
    #undoBtn:hover{background:#eef1f4}
    #runBtn{top:8px;left:100px;padding:8px;line-height:0;cursor:pointer}
    #runBtn:hover{background:#eef1f4}
    #stepBtn{top:8px;left:146px;padding:8px;line-height:0;cursor:pointer}
    #stepBtn:hover{background:#eef1f4}
    /* noinspection CssUnusedSymbol -- toggled via classList.toggle('active', ...) */
    #stepBtn.active,#runBtn.active{background:#e6a817}
    #burger span{display:block;width:22px;height:2px;margin:4px 0;background:#1f2328;transition:.15s}
    #burger[aria-expanded="true"] span:first-child{transform:translateY(6px) rotate(45deg)}
    #burger[aria-expanded="true"] span:nth-child(2){opacity:0}
    #burger[aria-expanded="true"] span:last-child{transform:translateY(-6px) rotate(-45deg)}
    #nav{top:46px;display:none;min-width:180px;overflow:hidden}
    #nav button,#nav summary{display:block;width:100%;box-sizing:border-box;padding:10px 16px;color:#1f2328;background:none;border:0;font:inherit;text-align:left;white-space:nowrap;cursor:pointer}
    #nav button:hover,#nav summary:hover,#nav details[open]>summary{background:#eaedf0}
    #nav summary{list-style:none}
    #nav summary::-webkit-details-marker{display:none}
    #nav .chev{float:right;transition:transform .15s}
    #nav details[open] .chev{transform:rotate(90deg)}
    #nav details button{padding-left:32px;opacity:.85}
    #nav details details summary{padding-left:32px;opacity:.85}
    #nav details details button{padding-left:48px}
    #nav button[data-flag]::before,#nav button[data-ui]::before{content:"✓ ";opacity:0}
    #nav button[data-flag][data-checked="true"]::before,#nav button[data-ui][data-checked="true"]::before{opacity:1}
  </style>
</head>

<template id="squash-fold">
// Squash fold — open a pocket and flatten it
d 200 200
c2d p1 p2
o -1 f0
c2d p0 p1
t 500 r s6 -180 p3 p8 p2
c3d p0 p1
by3d p6 p1
o -10 f1
t 500 fit
t 1000 r s9 -180 p2 a p5

</template>
<template id="rabbit-ear-fold">
// Rabbit-ear fold — fold a corner point up between two creases
d 200 200
by2d p0 p2 by2d p1 p3
b2d s6 s1 b2d s7 s2
p2d s1 p5
t 1000 r s9 180 p6 a p2
check
</template>
<template id="reverse-fold">
// Inside and outside reverse folds on a protruding flap
d 200 200
by2d p1 p3
o -1 f1
t 200 r s4 -180 p2
split s4 0.5 sp p4
p3d s0 p4
b3d s7 s5
t 500 z 0.99 move 59 43 0
t 500 r s7 -180 p8 a p1
t 500 r s7 180 p8 a p1
t 500 fit
check

</template>
<template id="square-base">

t 1000 r s6 -90 p7 r s7 -90 p5 a p2
t 1000 fit
check
</template>
<template id="triangle-base">
// Triangle base
d 200 200
by2d p0 p2 by2d p1 p3
c2d p0 p1 c2d p1 p2
t 1000 r s5 -180 p8 r s6 180 p7 a p2 p3 p5

check
</template>
<template id="petal-fold">
// Petal fold — fold both sides of a flap to the center, then flatten

by2d p0 p2 by2d p1 p3
c2d p0 p1 c2d p1 p2
t 200 r s11 -180 p1 r s15 -180 p3 a p5 p2 p7
t 200 r s6 -90 p7 r s7 -90 p5 a p2

tz 45 z 0.71
b3d s2 s4 b3d s0 s4 by3d p9 p11
t 200 zoom 0.75 0 0 move 0 -75 0

t 2000 r s31 -178 p2 a p5 p7
t 100 fit
</template>

<template id="plane">
  // Paper airplane by Vibe Mistral
  define 200 200
  textures
  // Center crease
  across2d p0 p1
  // Wing creases while the sheet is still flat
  across2d p4 p1
  across2d p4 p0
  // Fold top corners to the center
  bisector2d s2 s6
  bisector2d s11 s6
  offset -1 f0 f4 f5 f1 f3
  t 1000 r s16 180 p2 p7
  t 1000 r s20 -180 p3 p9
  // Crease the folded flaps along the future wing line
  split s15 0.5
  split s3 0.5
  by3d p10 p14
  by3d p12 p15
  // Fold in half along the center
  offset -2 f1 f3 f6 f7 f9
  t 1000 r s6 170 p0 p8 p13 p12 p3 p9 p15
  t 200 ty -45
  // Open the wings to fly
  t 300 r s9 80 p1 p11
  t 300 r s17 80 p0 p13
  // Stand the fuselage up, wings toward the camera
  t 500 tz 90
  t 500 fit
  // Show
  iao
  t 1000 z 0.5 0 0
  t 1000 fit
  iao
  t 1000 ty 360
</template>

<template id="cocotte">
  // Cocotte
  define 200 200
  textures
  // Define crease pattern
  c3d p0 p1 c3d p0 p3 c3d p0 p2 c3d p1 p3 c3d p0 p8 c3d p8 p3
  c3d p0 p4 c3d p4 p1 c3d p6 p0 c3d p6 p1 c3d p6 p2 c3d p6 p3
  // Movements with Accelerate Decelerate Interpolator (iad)
  iad
  t 100 ty 180
  // Fold one corner
  offset 1 f13 f14 f30 f31
  t 100 r s54 -180 p3 p17 p19
  t 100 ty 180
  // Fold from top
  t 100 rotate s27 170 p5 p22 p2
  // Lift up top right corner
  t 100 r s53 -100 p22 a p2 p7 p18
  // Fold from right
  t 100 r s45 170 p7 p12 p1 a p2 p18
  // Flatten leg
  t 100 r s53 45 p22 a p2 p18
  // Lay leg flat
  t 100 r s53 30 p22 p2 p18
  // Lift up bottom right corner
  t 100 r s50 -100 p12 a p1 p24
  // Fold from bottom
  t 100 r s23 170 p0 p21 p4 a p1 p24
  // Flatten leg
  t 100 r s51 45 p24 a p1 p12
  // Lay leg flat
  t 100 r s51 80 p12 p1 p24 a p12
  // Lift bottom left corner
  t 100 r s48 -100 p21 a p0 p9
  // Fold from left
  t 100 r s37 -170 p8 a p0 p9
  // Flatten leg
  t 100 r s48 -45 p9 a p0 p9
  // Lay leg flat
  t 100 r s48 -70 p21 p9 p0 a p9
  // Fold along median and open beak
  t 100 r s28 -180 p19 p5 p7 p22 p2 p14 p15 p18 p23 r s38 -170 p3
  // Pretty
  r s50 -5 p12 a p1
  offset // Remove offset for all faces
  // Beak
  t 100 r s54 15 p19 r s55 15 p17 a p3
  // Tail
  t 100 r s13 -10 p24 p12 p1
  a p12 p24 p1
  // Show
  t 100 tz -45
  iao
  t 1000 z 0.5 0 50
  t 1000 fit
  iao
  t 1000 ty 360
</template>

// revived, so `is3d` set while visiting 'frame_attributes' is still readable
// on `this` when 'vertices_coords' (a sibling key) is visited next.
function reviverFold(key, value) {
    if (key === 'frame_attributes') {
        this.is3d = value.includes('3D');
        return value;
    } else if (key === 'vertices_coords') {
        if (this.is3d) {
            return value.map((xyz) => new Point(xyz[0], xyz[1], xyz[0], xyz[1], xyz[2]));

            return value.map((xy) => new Point(xy[0], xy[1]));

class ReadWrite {

    static chooseFile() {
        return new Promise((resolve) => {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.txt,text/plain';
            input.onchange = (e) => {
                resolve(/** @type {HTMLInputElement} */ (e.target).files?.[0] || null);
            };
            input.onabort = () => resolve(null);
            input.oncancel = () => resolve(null);
            input.click();

    }

    // Replace the command queue (and stop a running animation)
    static resetCommand(command) {
        command.done = [];
        command.tokenTodo = [];
        command.iToken = 0;
        command.instructions = [];
        command.tpi = 0;
        command.tni = 1;
        command.model.state = State.run;
    }

    // Load a command script or a FOLD JSON into an existing Command
    static loadText(command, text) {
        const trimmed = String(text ?? '').replace(/^\uFEFF/, '').trim();
        if (!trimmed) return 'empty';
        if (trimmed.startsWith('{')) {
            try {
                const loaded = ReadWrite.jsonFoldToModel(trimmed);
                const keep = {
                    labels: command.model.labels,
                    textures: command.model.textures,
                    lines: command.model.lines,
                    snap: command.model.snap,
                };
                ReadWrite.resetCommand(command);
                Object.assign(command.model, loaded, keep);
                command.model.state = State.run;
                ReadWrite.syncCommandArea(command, '');
                return 'fold';

                // Fall through and treat as a command script

        ReadWrite.resetCommand(command);
        const area = command.commandArea;
        command.commandArea = undefined;
        command.command(trimmed);
        command.commandArea = area;
        ReadWrite.syncCommandArea(command, trimmed);
        return 'script';
    }

    // Push loaded text into the command area: a textarea (tests / old console)
    // is replaced in place; a log panel is cleared then addLine'd. Missing
    // hooks are ignored so a log-only area no longer throws on .textarea.
    static syncCommandArea(command, text) {
        const area = command.commandArea;
        if (!area) return;
        if (area.textarea) {
            let withNl = '';
            if (text !== '') withNl = text.endsWith('\n') ? text : `${text}\n`;
            area.textarea.value = withNl;
            area.textarea.selectionStart = area.textarea.selectionEnd = withNl.length;
            return;

    // Read with FileReader return text or null
    static async readFileAsText(filename) {
        if (typeof Deno !== "undefined") {
            if (!filename) return null;
            return await Deno.readTextFile(filename);

        const file = await this.chooseFile();
        if (!file) return null;
        return await file.text();
    }

    static async writeFold(model, filename = 'OriSim3d.fold') {
        const json = this.toJSONFold(model);
        if (!filename.endsWith('.fold')) filename = `${filename}.fold`;
        await ReadWrite.saveTextFile(json, filename, 'application/json');
        return json;
    }

    // Save text content to disk: a real file under Deno, or a browser download otherwise.
    static async saveTextFile(text, filename, mimeType) {
        if (typeof Deno !== "undefined") {
            await Deno.writeTextFile(filename, text);
            return;
        }

    // Face fill color for SVG export: blue tint on the front (normal z > 0),
    // yellow on the back (normal z < 0), lit by a fixed overhead light. Model

    // camera's.
    /**
     * @param {{ points: import('./Point.js').Point[] }} face

    static svgFaceFillColor(face) {
        const n = Model.normal(face);
        const front = n[2] > 0;
        const lightLen = Math.hypot(0.1, 0.1, 0.75);
        const directional = (n[0] * 0.1 + n[1] * 0.1 + n[2] * 0.75) / lightLen;
        const lighting = Math.max(0, front ? 0.1 + directional : 0.1 - directional);

    static svgFaceDepth(face) {
        const n = Model.normal(face);

    /**

    static buildSVG(model) {
        let xMin = Infinity, yMin = Infinity, xMax = -Infinity, yMax = -Infinity;
        for (const p of model.points) {
            if (p.xCanvas == null || p.yCanvas == null) continue;
            xMin = Math.min(xMin, p.xCanvas);
            yMin = Math.min(yMin, p.yCanvas);
            xMax = Math.max(xMax, p.xCanvas);
            yMax = Math.max(yMax, p.yCanvas);

        if (!Number.isFinite(xMin)) {
            throw new Error('buildSVG: no projected canvas coordinates (set xCanvas/yCanvas first)');
        }
        const pad = 10;
        const width = Math.max(xMax - xMin, 1) + 2 * pad;
        const height = Math.max(yMax - yMin, 1) + 2 * pad;
        const toSvg = (p) => `${(p.xCanvas - xMin + pad).toFixed(2)},${(p.yCanvas - yMin + pad).toFixed(2)}`;

            ReadWrite.svgFaceDepth(a) - ReadWrite.svgFaceDepth(b));

            const x1 = (s.p1.xCanvas - xMin + pad).toFixed(2);
            const y1 = (s.p1.yCanvas - yMin + pad).toFixed(2);

    static async writeSVG(model, filename = 'OriSim3d.svg') {
        const {width, height, content} = ReadWrite.buildSVG(model);
        const svg = `<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="${width.toFixed(2)}" height="${height.toFixed(2)}" viewBox="0 0 ${width.toFixed(2)} ${height.toFixed(2)}" fill="none" stroke="#111" stroke-width="1">

</svg>

    }

    // Simple orthographic (x,y) -> canvas projection for a model with no live WebGL view,
    // e.g. a headless step snapshot from Command.replaySteps. y is flipped (SVG y grows down).
    static projectOrtho(model) {
        for (const p of model.points) {
            p.xCanvas = p.x;
            p.yCanvas = -p.y;

    }

    // Lay out a sequence of Model snapshots as a grid of 3D-view SVG cells, one cell per step:

    // same front/back blue/yellow face tinting.
    static diagramsToSVG(models, {cols = 4, cellSize = 220, pad = 12} = {}) {

        const height = rows * cellSize;

            ReadWrite.projectOrtho(model);

            const yf = (p.yf - yMin) / ratio - 200;

                p.yf = yf;

                p.yf = yf;
                p.x = xf;
                p.y = yf;

            }

    }

// Interprets a list of commands and apply them on Model

class Command {
    model; // Current model
    // Tokenized commands
    tokenTodo = [];
    iToken = 0;
    done = []; // List of model states
    instructions = []; // List of commands done
    // Time interpolated at an instant 'p' preceding and at instant 'n' now
    tpi = 0;
    tni = 1;
    // Rotation axes of the current animated line, frozen at its start (Segment -> {p1, p2})
    frozenAxes = new Map();
    // Interpolator used in anim() to map tn (time normalized) to tni (time interpolated)
    interpolator = Interpolator.LinearInterpolator;
    // Animation
    duration = 0;
    tStart = 0;
    // Eventual CommandArea
    commandArea;
    // When true, newly queued instructions pause instead of auto-running, so the
    // step-by-step debug button can advance them one line at a time.
    stepMode = false;
    // Optional 3D view (for svg export and other view-dependent commands)
    /** @type {{ modelView?: Float32Array, updateCanvasCoords?: () => void } | null} */
    view3d;

    /**
     * @param {import('./Model.js').Model} model
     * @param {{ modelView?: Float32Array, updateCanvasCoords?: () => void } | null} [view3d]
     */
    constructor(model, view3d = null) {
        this.model = model;
        this.view3d = view3d;
    }

    // The main entry point executes a string of commands
    command(cde) {
        this.commandArea?.addLine(cde);
        const tokens = this.tokenize(cde);
        if (tokens[0] === 'd' || tokens[0] === 'define') {
            this.done = [];
            this.tokenTodo = [];
            this.iToken = 0;
            this.instructions = [];
            // A fresh model replaces whatever script was running before.
            this.model.state = State.run;
        } else if (tokens[0] === 'u' || tokens[0] === 'undo') {
            // Drop the snapshot of the live model; runUndo restores the previous one.
            if (this.done.length > 0) {
                this.done.pop();
                this.instructions.pop();
            }
            this.model.state = State.undo;
            return this;
        } else if (tokens[0] === 'run') {
            this.model.state = State.run;
            this.stepMode = false;
            return this;
        } else if (tokens[0] === 'stop') {
            this.tokenTodo.length = this.iToken;
            return this;
        }
        if (this.model.state === State.undo) {
            this.model.state = State.run;
        }
        this.tokenTodo.push(...tokens);
        if (this.stepMode) {
            this.model.state = State.pause;
        }
        return this;
    }

    stepLine() {
        if (this.model.state === State.pause) {
            this.model.state = State.run;
        }
        let advanced = false;
        while (this.model.state === State.anim || this.iToken < this.tokenTodo.length) {
            if (this.model.state === State.anim) {
                this.tStart = performance.now() - this.duration - 1; // force tn >= 1
                this.runAnim();
                advanced = true;
                continue;
            }
            const wasNewline = this.peek() === '\n';
            if (!this.runNext()) break;
            advanced = true;
            if (wasNewline) break;
        }
        this.model.state = State.pause;
        return advanced;
    }
    // Tokenize, split the input String in Array of String
    tokenize(input) {
        const cleaned = input
            .replaceAll(/(:?\/\/|<!--)[^\r\n]*/g, '') // Remove comments
            .replaceAll(/^\s*$/gm, '')   // Remove spaces only lines
            .replaceAll(/\n{2,}/g, '\n') // Remove empty lines
            .trim();                  // Remove leading/trailing whitespace
        return cleaned.match(/\S+|\n/g) || [];
    }

    isNumber(token) {
        return token !== '\n' && !Number.isNaN(Number(token));
    }

    peek() {
        return this.tokenTodo[this.iToken];
    }

    next() {
        return this.tokenTodo[this.iToken++];
    }

    // Optional number with default
    num(fallback) {
        return this.isNumber(this.peek()) ? Number.parseFloat(this.next()) : fallback;
    }

    // Consume one token (always advances, like the previous idx++)
    token(prefix) {
        const token = this.listTokens(this.tokenTodo, this.iToken, prefix)[0];
        this.iToken++;
        return token;
    }

    // Consume a run of tokens with the same prefix (p0 p1 p2...)
    tokens(prefix) {
        const list = this.listTokens(this.tokenTodo, this.iToken, prefix);
        this.iToken += list.length;
        return list;
    }

    // Animation delta between previous and current interpolated time
    get dt() {
        return this.tni - this.tpi;
    }

    // State machine returns true if the model needs redrawing
    // Only 4 states: run, anim, undo, pause
    // Called by requestAnimationFrame(loop)
    anim() {
        switch (this.model.state) {
            case State.pause:
                return false;
            case State.run:
                return this.runNext();
            case State.undo:
                return this.runUndo();
            case State.anim:
                return this.runAnim();
            default:
                console.log('unhandled state', Object.keys(State)[this.model.state]);
                return false;
        }
    }

    runNext() {
        if (this.iToken >= this.tokenTodo.length) {
            return false;
        }
        this.idxBefore = this.iToken;
        // Handle time command to start animation and switch to Anim
        if (this.peek() === 't' || this.peek() === 'time') {
            // Snapshot before the animated line (state is still run). Without it,
            // undo only has anim-frame snapshots and never returns to State.run.
            this.pushUndo();
            this.iToken++;
            this.duration = Number.parseFloat(this.next());
            this.tStart = performance.now();
            this.tpi = 0;
            this.model.state = State.anim;
            return true;
        }
        this.execute(this.iToken);
        this.doneInstructions(this.idxBefore, this.iToken);
        return true;
    }

    runUndo() {
        // Empty stack: stay in undo and nothing ever runs again (commandArea / mouse).
        if (this.done.length === 0) {
            this.model.state = State.run;
            return false;
        }
        this.popUndo();
        // Continue undo through per-frame snapshots of an animated line
        if (this.model.state === State.anim) {
            this.model.state = State.undo;
            return true;
        }
        this.model.state = this.stepMode ? State.pause : State.run;
        return true;
    }

    runAnim() {
        const tn = Math.min((performance.now() - this.tStart) / this.duration, 1);
        const targetTni = this.interpolator(tn);
        // Execute commands after t xxx up to end of line
        const iBeginAnim = this.iToken;
        // Commands like 'a' (adjust) resolve a point's 3d position iteratively from
        // its position in the *previous* step, so a big jump in a single call (a short
        // duration, or a slow display giving few real frames) can make it settle on the
        // wrong stable fold instead of the one continuous small motions converge to.
        // Replay this frame's motion as small fixed-size substeps so the result only
        // depends on the animated distance, not on how many real frames covered it.
        if (this.tpi === 0) this.freezeRotateAxes(iBeginAnim);
        const maxStep = 0.01;
        const steps = Math.max(1, Math.ceil(Math.abs(targetTni - this.tpi) / maxStep));
        for (let i = 1; i <= steps; i++) {
            this.tni = this.tpi + (targetTni - this.tpi) * i / steps;
            this.iToken = iBeginAnim;
            const recordUndo = i === steps;
            while (this.iToken < this.tokenTodo.length && this.peek() !== '\n') {
                this.execute(this.iToken, recordUndo);
            }
            this.tpi = this.tni;
        }
        if (tn >= 1) {
            this.tni = 1;
            this.tpi = 0;
            this.frozenAxes.clear();
            if (this.model.snap) {
                this.model.snapPoints();
            }
            this.doneInstructions(this.idxBefore, this.iToken);
            this.model.state = State.run;
            return true;
        }
        this.iToken = iBeginAnim;
        return true;
    }

    // A rotated point can itself be another simultaneous rotation's axis endpoint
    // (e.g. `t 1000 r s6 180 p7 r s13 -90 p5` where s13 = p7-p4): re-reading the
    // axis live, substep after substep, would make it drift along with that point.
    // Snapshot the axis of every `r` of the line before any of them has run, so the
    // last rotation does not see an axis already moved by the earlier ones.
    freezeRotateAxes(iBegin) {
        this.frozenAxes.clear();
        for (let i = iBegin; i < this.tokenTodo.length && this.tokenTodo[i] !== '\n'; i++) {
            if (this.tokenTodo[i] !== 'r' && this.tokenTodo[i] !== 'rotate') continue;
            const s = this.listTokens(this.tokenTodo, i + 1, 's')[0];
            if (s && !this.frozenAxes.has(s)) {
                this.frozenAxes.set(s, {
                    p1: {x: s.p1.x, y: s.p1.y, z: s.p1.z},
                    p2: {x: s.p2.x, y: s.p2.y, z: s.p2.z},
                });
            }
        }
    }

    doneInstructions(idxBefore, idxAfter) {
        const doneCommands = this.tokenTodo.slice(idxBefore, idxAfter).join(' ');
        if (doneCommands === 'undo') {
            this.instructions.pop();
        } else if (doneCommands !== '' && doneCommands !== '\n') {
            this.instructions.push(doneCommands);
        }
    }

    // Execute one instruction from tokenTodo starting at idx on the model.
    // pushUndo defaults to true (every non-animated call site wants a snapshot);
    // runAnim() passes false for all but an animated line's last real-frame substep.
    execute(idx, pushUndo = true) {
        this.iToken = idx;
        const token = this.next();
        const command = COMMANDS[token];
        if (command) {
            command(this);
        } else if (token !== '\n') {
            this.skipUnexpected();
        }
        if (pushUndo) this.pushUndo();
    }

    skipUnexpected() {
        const idx = this.iToken - 1;
        console.log('Unexpected end of command', this.tokenTodo.slice(idx, idx + 3).join(' '));
        this.iToken = idx;
        while (this.peek() !== '\n' && this.iToken < this.tokenTodo.length) {
            this.iToken++;
        }
        if (this.iToken < this.tokenTodo.length) {
            this.iToken++;
        }
    }

    listTokens(tokenList, iStart, prefix) {
        const list = [];
        prefix = prefix.toLowerCase();
        const collections = {p: this.model.points, s: this.model.segments, f: this.model.faces};
        const collection = collections[prefix];
        while (iStart < tokenList.length) {
            const token = tokenList[iStart];
            if (token === '\n' || !token || token[0].toLowerCase() !== prefix) break;
            if (token.length < 2) break;
            const n = Number(token.slice(1));        // '' → 0
            if (Number.isNaN(n) || !collection?.[n]) break;   // 0 n'est pas NaN, collection[0] existe
            list.push(collection[n]);
            iStart++;
        }
        return list;
    }

    pushUndo() {
        if (this.model.state === State.anim) {
            this.done.push({
                state: State.anim,
                coords: this.model.snapshotPositions(),
            });
        } else {
            this.done.push(this.model.serialize());
        }
    }

    popUndo() {
        if (this.done.length === 0) {
            return;
        }
        const snapshot = this.done.pop();
        if (typeof snapshot === 'string') {
            Object.assign(this.model, Model.deserialize(snapshot));
        } else if (snapshot?.state === State.anim) {
            this.model.state = State.anim;
            if (snapshot.coords) {
                this.model.restorePositions(snapshot.coords);
            }
        }
    }
}

function reportError(cmd, message) {
    cmd.commandArea?.addLine(`// ${message}`);
}

function take(cmd, prefix, n, label, apply) {
    const list = cmd.tokens(prefix);
    if (list.length !== n) {
        const got = cmd.tokenTodo.slice(cmd.iToken, cmd.iToken + n + 1).join(' ');
        reportError(cmd, `${label} (got ${list.length}: ${got})`);
        return;
    }
    apply(...list);
}

// Consume one token per given prefix (e.g. one segment then one point), reporting a
// commandArea error if any of them is missing, wrong type, or out of order.
function takeOne(cmd, prefixes, label, apply) {
    const start = cmd.iToken;
    const list = prefixes.map((prefix) => cmd.token(prefix));
    if (list.some((o) => o === undefined)) {
        const got = cmd.tokenTodo.slice(start, cmd.iToken).join(' ');
        reportError(cmd, `${label} (got: ${got})`);
        return;
    }
    apply(...list);
}

function select(cmd, prefix, collection) {
    const selected = cmd.tokens(prefix);
    collection.forEach((o) => {
        o.select = selected.includes(o) && !o.select;
    });
}

function turn(axis) {
    return (cmd) => {
        const angle = Number(cmd.next()) * cmd.dt;
        cmd.model.turn(axis, angle);
    };
}

function define(cmd) {
    cmd.model.init(cmd.num(200), cmd.num(200));
}

// Replay a recorded instruction list (cmd.instructions) on a fresh headless Model,
// instantly settling any 't'-animated line, one Model snapshot returned per instruction.
function replaySteps(instructions) {
    const replay = new Command(new Model());
    const steps = [];
    for (const line of instructions) {
        replay.command(line);
        while (replay.iToken < replay.tokenTodo.length || replay.model.state === State.anim) {
            if (replay.model.state === State.anim) {
                replay.tStart = performance.now() - replay.duration - 1; // force tn >= 1
            }
            if (!replay.anim()) break;
        }
        steps.push(Model.deserialize(replay.model.serialize()));
    }
    return steps;
}

function splitSegment(cmd) {
    const s = cmd.token('s');
    const k = Number.parseFloat(cmd.next());
    if (k >= 0 && k <= 1) {
        cmd.model.splitSegmentByRatio2d(s, k);
    }
}

// Uses the axis frozen at the start of the animated line (see freezeRotateAxes),
// or the live segment for a plain non-animated 'r'.
function rotate(cmd) {
    const s = cmd.token('s');
    const angle = Number(cmd.next()) * cmd.dt;
    const axis = cmd.model.state === State.anim ? cmd.frozenAxes.get(s) : undefined;
    cmd.model.rotate(axis ?? s, angle, cmd.tokens('p'));
}

function move(cmd) {
    const d = cmd.dt;
    const dx = Number(cmd.next()) * d;
    const dy = Number(cmd.next()) * d;
    const dz = Number(cmd.next()) * d;
    cmd.model.movePoints(dx, dy, dz, cmd.tokens('p'));
    cmd.model.checkSegments();
}

function zoom(cmd) {
    const scale = Number.parseFloat(cmd.next());
    const a = (1 + cmd.tni * (scale - 1)) / (1 + cmd.tpi * (scale - 1));
    cmd.model.zoom(a, cmd.num(0), cmd.num(0));
}

function fit(cmd) {
    if (cmd.tpi === 0) {
        const b = cmd.model.get3DBounds();
        cmd.fitScale = 400 / (Math.max(b.xMax - b.xMin, b.yMax - b.yMin) || 1);
        cmd.fitCx = (b.xMin + b.xMax) / 2;
        cmd.fitCy = (b.yMin + b.yMax) / 2;
    }
    const s = cmd.fitScale;
    const a = (1 + cmd.tni * (s - 1)) / (1 + cmd.tpi * (s - 1));
    cmd.model.zoom(a, 0, 0);
    const k = s * (a * cmd.tpi - cmd.tni);
    cmd.model.movePoints(cmd.fitCx * k, cmd.fitCy * k, 0, cmd.model.points);
    if (cmd.tni ===1) {
        cmd.commandArea?.addLine(`// Fit: zoom ${Math.round(a * 100) / 100} 0 0 move ${Math.round(cmd.fitCx)} ${Math.round(cmd.fitCy)} 0`);
    }
}

// Order faces front-to-back: the first face is set nearest the viewer, each
// following one progressively behind it.
function order(cmd) {
    const faces = cmd.tokens('f');
    faces.forEach((face, i) => {
        const rank = faces.length - 1 - i;
        const nz = Model.normal(face)[2];
        face.offset = rank === 0 ? 0 : Math.sign(nz) * rank;
    });
}

const COMMANDS = {};
function on(names, command) {
    for (const name of names.split(/\s+/)) {
        COMMANDS[name] = command;
    }
}

function help(cmd) {
    // Group names that were registered together (on('by by3d', fn)) as aliases
    // of the same command, so each line lists synonyms together.
    const byFn = new Map();
    for (const [name, fn] of Object.entries(COMMANDS)) {
        if (!byFn.has(fn)) byFn.set(fn, []);
        byFn.get(fn).push(name);
    }
    const groups = [...byFn.values()];
    cmd.commandArea?.addLine(`Commandes (${groups.length}) :\n${groups.map((g) => g.join('/')).join('\n')}`);
}

class CommandArea {
    constructor(command, textarea) {
        this.textarea = textarea;
        this.textarea.addEventListener('keydown', this.keydown.bind(this));
        this.command = command;
        command.commandArea = this;
    }

    addLine(text) {
        const value = this.textarea.value;
        const lastLineStart = value.lastIndexOf('\n') + 1;
        const lastLine = value.substring(lastLineStart).trim();
        if (lastLine === text) {
            // Only a new line
            this.textarea.value += `\n`;
        } else {
            // Insert at the end
            this.textarea.value += `${text}\n`;
        }
        // Scroll to the end
        this.textarea.selectionStart = this.textarea.selectionEnd = this.textarea.value.length;
        this.textarea.focus();
    }

    keydown = function (e) {
        const el = e.target; // HTMLTextAreaElement
        if (e.key === 'Enter') {
            e.preventDefault();
            const caretPos = el.selectionStart;
            const value = el.value;
            const start = value.lastIndexOf('\n', caretPos - 1) + 1;
            let end = value.indexOf('\n', caretPos);
            if (end === -1) {
                end = value.length;
            }
            const line = value.substring(start, end);
            this.command.command(line);
            this.textarea.selectionStart = this.textarea.selectionEnd = this.textarea.value.length;
            el.scrollTop = el.scrollHeight;
        }
        // Control Z to undo
        if (e.key === 'z' && (e.ctrlKey || e.metaKey)) {
            e.preventDefault();
            e.stopPropagation();
            this.command.command('undo');
        }
    }
}



const CLICK_PX_MOUSE = 12;
const CLICK_PX_TOUCH = 24;
// A fingertip covers far more pixels than a cursor: widen the pick radii accordingly
const PICK_FACTOR_TOUCH = 2;

class Helper {
    constructor(model, command, view3d, view2d) {
        this.model = model;
        this.command = command;
        this.view3d = view3d;
        this.view2d = view2d;
        this.currentCanvas = undefined;
        this.orbiting = false;
        this.touchTime = 0;
        this.lastClickPoints = [];
        this.pointerType = 'mouse';
        // Mouse coordinates, first and current
        this.firstX = this.firstY = this.currentX = this.currentY = undefined;
        // Correctif pour les gestes tactiles
        let lastTouchDistance = 0;

        // To test with Deno, view3d (and its overlay) may be null
        const overlay = view3d?.overlay;
        if (overlay) {
            overlay.addEventListener('pointerdown', (event) => {
                if (event.button === 1) event.preventDefault(); // no autoscroll
                try { overlay.setPointerCapture(event.pointerId); } catch { /* ignore */ }
                this.down3d(event);
            });
            overlay.addEventListener('pointermove', (event) => this.move3d(event));
            overlay.addEventListener('pointerup', (event) => this.up3d(event));
            overlay.addEventListener('pointercancel', (event) => this.out(event));
            overlay.addEventListener('wheel', (event) => this.wheel(event), {passive: true});
            overlay.addEventListener('contextmenu', (event) => {event.preventDefault();});
            // Keyboard
            document.addEventListener('keydown', (event) => this.keydown(event));
            // Tactile
            document.addEventListener('touchstart', function(e) {
                if (e.touches && e.touches.length >= 2) {
                    const t0 = e.touches[0];
                    const t1 = e.touches[1];
                    const dx = t0.clientX - t1.clientX;
                    const dy = t0.clientY - t1.clientY;
                    lastTouchDistance = Math.sqrt(dx*dx + dy*dy);
                }
            });
            // Add e.scale for View3d
            document.addEventListener('touchmove', function(e) {
                if (e.touches && e.touches.length >= 2 && !e.scale) {
                    const t0 = e.touches[0];
                    const t1 = e.touches[1];
                    const dx = t0.clientX - t1.clientX;
                    const dy = t0.clientY - t1.clientY;
                    const currentDist = Math.sqrt(dx*dx + dy*dy);
                    if (lastTouchDistance > 0) {
                        e.scale = currentDist / lastTouchDistance;
                        lastTouchDistance = currentDist;
                    }
                }
            });
        }
        // Flat crease-pattern view — covers mouse and touch
        const canvas2d = view2d?.canvas2d;
        if (canvas2d) {
            canvas2d.addEventListener('pointerdown', (event) => {
                try { canvas2d.setPointerCapture(event.pointerId); } catch { /* ignore */ }
                this.down2d(event);
            });
            canvas2d.addEventListener('pointermove', (event) => this.move2d(event));
            canvas2d.addEventListener('pointerup', (event) => this.up2d(event));
            canvas2d.addEventListener('pointercancel', (event) => this.out(event));
        }
        this.out();
    }

    // Pointer events report the device kind: 'mouse', 'pen' or 'touch'.
    // Recorded on each pointerdown, it classifies the whole gesture that follows.
    // A stylus is as precise as a cursor, only a finger is coarse.
    setPointerType(event) {
        this.pointerType = event?.pointerType || 'mouse';
    }

    coarsePointer() {
        return this.pointerType === 'touch';
    }

    clickThreshold() {
        return this.coarsePointer() ? CLICK_PX_TOUCH : CLICK_PX_MOUSE;
    }

    // Multiplies the pick radii so a finger tap still catches points and segments
    pickFactor() {
        return this.coarsePointer() ? PICK_FACTOR_TOUCH : 1;
    }

    isClick() {
        const dx = (this.currentX ?? 0) - (this.firstX ?? 0);
        const dy = (this.currentY ?? 0) - (this.firstY ?? 0);
        return Math.hypot(dx, dy) < this.clickThreshold();
    }

    keydown(event) {
        // Control Z to undo
        if (event.key === 'z' && (event.ctrlKey || event.metaKey)) {
            this.command.command('undo');
        }
    }

    // Helper method to get formatted object string id (e.g. 'p0', 's1', 'f2')
    id(obj) {
        if (!obj) return '';
        if (this.model.points.includes(obj)) return 'p' + this.model.indexOf(obj);
        if (this.model.segments.includes(obj)) return 's' + this.model.indexOf(obj);
        if (this.model.faces.includes(obj)) return 'f' + this.model.indexOf(obj);
        return '';
    }

    out() {
        this.downPoints = [];
        this.downSegments = [];
        this.downPoint = this.downSegment = this.downFace = undefined;
        this.upPoints = [];
        this.upSegments = [];
        this.upPoint = this.upSegment = this.upFace = undefined;
        this.upFaces = [];
        this.downFaces = [];
        this.label = undefined;
        this.currentSegment = undefined;
        this.moving = false;
        this.orbiting = false;
    }

    clearSelection() {
        this.model.points.forEach(p => { p.select = false; });
        this.model.segments.forEach(s => { s.select = false; });
        this.model.faces.forEach(f => { f.select = false; });
    }

    selectedAxis() {
        return this.model.segments.find(s => s.select);
    }

    static FOLD_AMBER = '#e6a817';
    static VALLEY_COLOR = 'green';

    // Draw drag preview when down on a point, segment, or face: a filled arrow
    // for creasing (green — a crease has no mountain/valley until it's
    // actually folded) or moving a selected point (orange), a hollow arrow
    // only when the drag will actually fold the face (willFold()) — see Arrow.svg.
    draw() {
        if (!this.downPoint && !this.downSegment && !this.downFace) {
            return;
        }
        const context = (this.currentCanvas === '2d' ? this.view2d.canvas2d : this.view3d.overlay).getContext('2d');
        if (this.downFace && this.willFold()) {
            this.drawHollowArrow(context, this.firstX, this.firstY, this.currentX, this.currentY);
        } else {
            const color = this.moving ? 'orange' : Helper.VALLEY_COLOR;
            this.drawFilledArrow(context, this.firstX, this.firstY, this.currentX, this.currentY, color);
        }
        if (this.label) {
            const radius = 18;
            context.fillStyle = 'skyblue';
            context.beginPath();
            context.arc(this.currentX, this.currentY - 16, radius, 0, 2 * Math.PI);
            context.stroke();
            context.fill();
            context.fillStyle = 'black';
            context.font = '20px serif';
            context.fillText(this.label, this.currentX - 10, this.currentY - 8);
        }
    }

    // Thin straight shaft + small solid triangular head, both a fixed size —
    // only the shaft stretches with the drag. Crease preview (by/across/bisector);
    // orange when dragging a selected point to move it in 3d.
    drawFilledArrow(context, x1, y1, x2, y2, color = 'green') {
        const HEAD_LEN = 24, HEAD_HALF_W = 10;
        const dx = x2 - x1, dy = y2 - y1;
        const len = Math.hypot(dx, dy) || 1;
        const ux = dx / len, uy = dy / len;
        const px = -uy, py = ux;
        const shaftLen = Math.max(len - HEAD_LEN, 0);
        const sx = x1 + ux * shaftLen, sy = y1 + uy * shaftLen;

        context.strokeStyle = context.fillStyle = color;
        context.lineWidth = 6;
        context.lineCap = 'round';
        context.beginPath();
        context.moveTo(x1, y1);
        context.lineTo(sx, sy);
        context.stroke();
        context.beginPath();
        context.moveTo(x2, y2);
        context.lineTo(sx + px * HEAD_HALF_W, sy + py * HEAD_HALF_W);
        context.lineTo(sx - px * HEAD_HALF_W, sy - py * HEAD_HALF_W);
        context.closePath();
        context.fill();
    }

    // Straight thick shaft + hollow (outlined) triangular head, both a fixed size —
    // only the shaft stretches with the drag. Fold preview (rotating a face).
    drawHollowArrow(context, x1, y1, x2, y2) {
        const HEAD_LEN = 20, HEAD_HALF_W = 14, HALF_W = 6;
        const dx = x2 - x1, dy = y2 - y1;
        const len = Math.hypot(dx, dy) || 1;
        const ux = dx / len, uy = dy / len;
        const px = -uy, py = ux;
        const shaftLen = Math.max(len - HEAD_LEN, 0);
        const sx = x1 + ux * shaftLen, sy = y1 + uy * shaftLen; // shaft end / head base

        context.fillStyle = '#fff';
        context.strokeStyle = Helper.FOLD_AMBER;
        context.lineWidth = 2;
        context.lineJoin = 'round';
        context.beginPath();
        context.moveTo(x1 + px * HALF_W, y1 + py * HALF_W);
        context.lineTo(sx + px * HALF_W, sy + py * HALF_W);
        context.lineTo(sx + px * HEAD_HALF_W, sy + py * HEAD_HALF_W);
        context.lineTo(x2, y2);
        context.lineTo(sx - px * HEAD_HALF_W, sy - py * HEAD_HALF_W);
        context.lineTo(sx - px * HALF_W, sy - py * HALF_W);
        context.lineTo(x1 - px * HALF_W, y1 - py * HALF_W);
        context.closePath();
        context.fill();
        context.stroke();
    }

    // Logic begins here
    down(points, segments, faces, x, y) {
        this.downPoints = points.length ? points : [];
        this.downPoint = this.downPoints[0];
        this.downSegments = !this.downPoint && segments.length ? segments : [];
        this.downSegment = this.downSegments[0];
        this.downFaces = !this.downPoint && !this.downSegment ? faces : [];
        this.downFace = this.downFaces[0];
        this.firstX = this.currentX = x;
        this.firstY = this.currentY = y;
        this.label = undefined;
        // 3d drag of an already-selected (hovered) point → animated move
        this.moving = !!(this.downPoint?.select && this.currentCanvas === '3d');
    }

    /** Select all stacked points, or deselect all if every one is already selected. */
    togglePointStack(points) {
        if (!points.length) return;
        const allOn = points.every(p => p.select);
        points.forEach(p => { p.select = !allOn; });
    }

    /** Select all stacked faces, or deselect all if every one is already selected. */
    toggleFaceStack(faces) {
        if (!faces.length) return;
        const allOn = faces.every(f => f.select);
        faces.forEach(f => { f.select = !allOn; });
    }

    /** Arm/disarm a segment as the sole fold axis — never a stack, only one axis at a time. */
    armAxis(segment) {
        const wasArmed = segment.select;
        this.model.segments.forEach(s => { s.select = false; });
        segment.select = !wasArmed;
        this.logSelectedSegments();
    }

    logSelectedSegments() {
        const ids = this.model.segments.filter(s => s.select).map(s => `${this.id(s)}(${Math.round(Segment.length2d(s))},${Math.round(Segment.length3d(s) / this.model.scale)})`);
        if (ids.length) {
            this.command.command(`// selectSegments ${ids.join(' ')}`);
        }
    }

    sameStack(a, b) {
        return !!a?.length && a.length === b?.length && a.every(o => b.includes(o));
    }

    isDoubleClickPoints(points) {
        return Date.now() - this.touchTime < 400
            && this.sameStack(points, this.lastClickPoints);
    }

    faceCentroidCanvas(face) {
        const pts = face.points;
        let x = 0, y = 0;
        for (const p of pts) {
            const c = this.canvasPoint(p);
            x += c.xf;
            y += c.yf;
        }
        return {x: x / pts.length, y: y / pts.length};
    }

    faceBorderSegments(face) {
        const segs = [];
        const pts = face.points;
        for (let i = 0; i < pts.length; i++) {
            const s = this.model.getSegment(pts[i], pts[(i + 1) % pts.length]);
            if (s) segs.push(s);
        }
        return segs;
    }

    // Signed rotation angle (degrees): angular sweep of the cursor around the
    // segment's midpoint (the hinge), relative to the reference point (the
    // dragged face's centroid at rest). Turning the cursor around the hinge
    // like a dial directly drives the fold angle by the same amount, instead
    // of trying to infer it from an on-screen distance ratio.
    // Uses canvasPoint() so 2d (xf,-yf) and 3d (xCanvas,yCanvas) stay consistent.
    rotationLabel(s, refX, refY, x, y) {
        const p1 = this.canvasPoint(s.p1), p2 = this.canvasPoint(s.p2);
        const pivotX = (p1.xf + p2.xf) / 2, pivotY = (p1.yf + p2.yf) / 2;
        if (Math.hypot(refX - pivotX, refY - pivotY) < 1e-6) return 0;
        const refAngle = Math.atan2(refY - pivotY, refX - pivotX);
        const curAngle = Math.atan2(y - pivotY, x - pivotX);
        let angle = (curAngle - refAngle) * 180 / Math.PI;
        angle = ((angle + 180) % 360 + 360) % 360 - 180; // normalize to (-180, 180]
        angle = Math.round(angle / 10) * 10;
        return Math.abs(angle) < 10 ? 0 : angle;
    }

    move(points, segments, faces, x, y) {
        this.model.hover2d3d(points, segments, faces);
        this.currentX = x;
        this.currentY = y;
        this.currentSegment = segments[0];
        this.label = undefined;

        if (this.downPoint) {
            this.downPoints.forEach(p => { p.hover = true; });
        } else if (this.downSegment) {
            this.downSegments.forEach(s => { s.hover = true; });
        } else if (this.downFace) {
            this.downFace.hover = true;
            const axis = this.selectedAxis();
            if (axis && this.faceBorderSegments(this.downFace).includes(axis)) {
                this.label = this.angleFor(axis);
            }
        }
    }

    up(points, segments, faces) {
        this.upPoints = points.length ? points : [];
        this.upPoint = this.upPoints[0];
        this.upSegments = !this.upPoint && segments.length ? segments : [];
        this.upSegment = this.upSegments[0];
        this.upFaces = !this.upPoint && !this.upSegment ? faces : [];
        this.upFace = this.upFaces[0];

        if (!this.downPoint && !this.downSegment && !this.downFace) {
            if (this.isClick()) this.clearSelection();
        } else if (this.downPoint) {
            this.fromPoint();
        } else if (this.downSegment) {
            this.fromSegment();
        } else if (this.downFace) {
            this.fromFace();
        }
        this.out();
    }

    fromPoint() {
        if (this.moving && !this.isClick()) {
            this.moveSelectedPoint();
            return;
        }

        const sameStack = this.isClick()
            && this.downPoints.length
            && this.sameStack(this.downPoints, this.upPoints);

        if (sameStack) {
            if (this.isDoubleClickPoints(this.downPoints)) {
                const ids = this.downPoints.map(p => this.id(p)).join(' ');
                this.command.command(`adjust ${ids}`);
                this.touchTime = 0;
                this.lastClickPoints = [];
                return;
            }
            this.touchTime = Date.now();
            this.lastClickPoints = [...this.downPoints];
            this.togglePointStack(this.downPoints);
            return;
        }

        if (this.model.faces.some(f => f.select)) {
            // Creases blocked while composing a fold
            return;
        }
        if (this.upPoint) {
            this.creaseTwoPoints(this.downPoint, this.upPoint);
        } else if (this.upSegment) {
            this.creaseFromPointToSegment(this.downPoint, this.upSegment);
        }
    }

    /**
     * Drag of a selected point in 3d: move only that hovered point (animated),
     * then adjust every other selected point to restore segment lengths.
     */
    moveSelectedPoint() {
        const {dx, dy, dz} = this.dragToWorld();
        if (dx === 0 && dy === 0 && dz === 0) return;
        const movedId = this.id(this.downPoint);
        const others = this.model.points
            .filter((p) => p.select && p !== this.downPoint)
            .map((p) => this.id(p));
        let cmd = `t 1000 m ${dx} ${dy} ${dz} ${movedId}`;
        if (others.length) cmd += ` adjust ${others.join(' ')}`;
        this.command.command(cmd);
    }

    dragToWorld() {
        const round = (n) => Math.round(n * 10) / 10;
        const delta = this.canvasDragToWorld3d(
            this.firstX, this.firstY, this.currentX, this.currentY, this.downPoint,
        );
        return {dx: round(delta.dx), dy: round(delta.dy), dz: round(delta.dz)};
    }

    // Unproject overlay drag at the point's projected depth (screen-parallel plane).
    canvasDragToWorld3d(x0, y0, x1, y1, point) {
        const fallback = {dx: x1 - x0, dy: -(y1 - y0), dz: 0};
        const m = this.view3d?.canvasView;
        if (!m || !point) return fallback;
        const inv = mat4.invert(mat4.create(), m);
        if (!inv) return fallback;
        const z = Vector3.transformMat4(point, m).z;
        const world0 = Vector3.transformMat4({x: x0, y: y0, z}, inv);
        const world1 = Vector3.transformMat4({x: x1, y: y1, z}, inv);
        return {
            dx: world1.x - world0.x,
            dy: world1.y - world0.y,
            dz: world1.z - world0.z,
        };
    }

    fromSegment() {
        const sameStack = this.isClick()
            && this.downSegments.length
            && this.sameStack(this.downSegments, this.upSegments);

        if (sameStack) {
            this.armAxis(this.downSegment);
            return;
        }

        if (this.model.faces.some(f => f.select)) {
            return;
        }
        if (this.upSegment) {
            this.creaseTwoSegments(this.downSegment, this.upSegment);
        } else if (this.upPoint) {
            this.creaseFromSegmentToPoint(this.downSegment, this.upPoint);
        }
    }

    fromFace() {
        if (this.isClick()) {
            this.fromFaceClick();
            return;
        }
        this.fromFaceDrag();
    }

    fromFaceClick() {
        const samePile = this.downFace && this.upFaces.includes(this.downFace);
        if (samePile) {
            this.toggleFaceStack(this.upFaces.length ? this.upFaces : this.downFaces);
        } else if (this.upFace) {
            // Different face: select Up front only; keep points/segments
            this.upFace.select = true;
        }
        const ids = this.model.faces.filter(f => f.select).map(f => `${this.id(f)}(${f.offset})`);
        if (ids.length) {
            this.command.command(`// selectFaces ${ids.join(' ')}`);
        }
    }

    /**
     * A drag on a face folds it only when a crease is already armed as the fold
     * axis (via a prior click on it — never guessed) and that crease borders this
     * face. Otherwise, the drag can only score a crease across existing paper
     * (splitting whatever it crosses into new landmark points), or — if it
     * crosses nothing — arm/select the face like a click would.
     */
    fromFaceDrag() {
        const axis = this.selectedAxis();
        if (axis && this.faceBorderSegments(this.downFace).includes(axis)) {
            const angle = this.angleFor(axis);
            if (angle) {
                this.foldAlong(axis, angle);
                return;
            }
        }
        if (this.splitSegments()) return;
        if (!this.downFace.select) this.fromFaceClick();
    }

    /** Rotation angle (degrees) if hinging the dragged face on `axis` right now. */
    angleFor(axis) {
        const c = this.faceCentroidCanvas(this.downFace);
        return this.rotationLabel(axis, c.x, c.y, this.currentX, this.currentY);
    }

    /** Would releasing now actually rotate the dragged face? */
    willFold() {
        const axis = this.selectedAxis();
        if (!axis || !this.faceBorderSegments(this.downFace).includes(axis)) return false;
        return !!this.angleFor(axis);
    }

    // Folds the dragged face plus any other already-selected faces around axis, by
    // angle. The axis stays armed afterwards, so folding the other side along the
    // same crease (a very common diagram pattern) is just a second plain drag.
    foldAlong(axis, angle) {
        this.rotatePoints(axis, angle);
        this.model.points.forEach(p => { p.select = false; });
        this.model.faces.forEach(f => { f.select = false; });
    }

    /**
     * Convert a screen-space ratio r along a projected segment (0 at p1, 1 at p2)
     * into the perspective-correct parameter t along the 3D segment.
     * w1/w2 are homogeneous clip w (≈ -zEye) at the endpoints.
     */
    static screenRatioToSegmentT(r, a =1, b =1) {
        const denominator = (1 - r) * b + r * a;
        if (Math.abs(denominator) < 1e-12) return r;
        return (r * a) / denominator;
    }

    /** Clip-space w used for the point's canvas projection (perspective weight). */
    clipW(point) {
        // Flat crease pattern is orthographic — no perspective weighting
        if (this.currentCanvas === '2d') return 1;
        const m = this.view3d?.canvasView;
        if (m) {
            const w = m[3] * point.x + m[7] * point.y + m[11] * point.z + m[15];
            if (Math.abs(w) > 1e-9) return w;
        }
        // zEye is negative in front of the camera; clip w ≈ -zEye
        const zEye = point.zEye;
        if (zEye !== undefined && zEye !== null && Math.abs(zEye) > 1e-9) {
            return -zEye;
        }
        return 1;
    }

    // A point's flat-drawing coordinates on the canvas the current gesture is on
    canvasPoint(p) {
        return this.currentCanvas === '2d'
            ? {xf: p.xf, yf: -p.yf}
            : {xf: p.xCanvas, yf: p.yCanvas};
    }

    /**
     * Segments the current drag actually cuts across, as {index, ratio} pairs.
     * Pure (no commands issued) so both splitSegments() and the live arrow
     * preview can share this without splitSegments() firing twice.
     */
    computeCrossedSegments() {
        const first = {xf: this.firstX, yf: this.firstY};
        const current = {xf: this.currentX, yf: this.currentY};
        // In 3d, layers can overlap on screen. Ignore a segment that's occluded
        // behind the face being dragged — the drag can only be scoring a line on
        // the visible surface, not a hidden layer that merely projects onto it.
        const downDepth = this.currentCanvas === '3d' && this.downFace && this.view3d.faceDepth
            ? this.view3d.faceDepth(this.downFace)
            : undefined;
        const crossings = [];
        this.model.segments.forEach((s, i) => {
            if (downDepth !== undefined) {
                const faces = this.model.searchFacesWithAB(s.p1, s.p2);
                const visible = faces.length === 0
                    || faces.some(f => this.view3d.faceDepth(f) <= downDepth + 1e-6);
                if (!visible) return;
            }
            const p1 = this.canvasPoint(s.p1);
            const p2 = this.canvasPoint(s.p2);
            const inter = Segment.intersectionFlat(first, current, p1, p2);
            if (!inter) return;
            const len = Math.hypot(p2.xf - p1.xf, p2.yf - p1.yf);
            if (len < 1e-9) return;
            const r = Math.hypot(inter.xf - p1.xf, inter.yf - p1.yf) / len;
            const t = Helper.screenRatioToSegmentT(r, this.clipW(s.p1), this.clipW(s.p2));
            const ratio = Math.round(t * 100) / 100;
            if (ratio > 0 && ratio < 1) crossings.push({index: i, ratio});
        });
        return crossings;
    }

    /** @returns {boolean} true if the drag actually cut across at least one existing segment */
    splitSegments() {
        const crossings = this.computeCrossedSegments();
        crossings.forEach(({index, ratio}) => this.command.command(`split s${index} ${ratio}`));
        return crossings.length > 0;
    }

    // command.command() only enqueues — the model applies it on the next
    // animation frame. A crease command is never animated ('t ...'), so it is
    // always fully applied by exactly one command.anim() call; running that
    // now (only when nothing else is already mid-animation) shows the result
    // immediately instead of a frame late. Also rebuilds the WebGL buffers
    // right away when something was actually applied: this bypasses the
    // render loop's own command.anim() check (the one that normally gates
    // initBuffers()/initModelView()), so without this the loop's next call
    // finds nothing left to apply and never uploads the change to canvas3d,
    // even though the model (and canvas2d, drawn straight from it) already
    // reflects it.
    runQueuedNow() {
        if (this.model.state === State.run && this.command.anim()) {
            this.view3d?.initBuffers();
            this.view3d?.initModelView();
        }
    }

    // Straight crease through both points ('by'). Just marks the crease —
    // mountain/valley is only meaningful once actually folded, so the new
    // segment is left unassigned ('U') regardless of drag direction.
    // 'by' cuts along the line through a and b: when they already share a
    // segment that line is that very segment, so 'by' would split nothing —
    // fall back to 'c' (cross), the coincidence-fold that brings a onto b.
    creaseTwoPoints(a, b) {
        const across = this.model.getSegment(a, b);
        if (this.currentCanvas === '2d') {
            if (across) this.command.command(`c2d ${this.id(a)} ${this.id(b)}`);
            else this.command.command(`by2d ${this.id(a)} ${this.id(b)}`);
        } else {
            if (across) this.command.command(`c3d ${this.id(a)} ${this.id(b)}`);
            else this.command.command(`by3d ${this.id(a)} ${this.id(b)}`);
        }
        this.runQueuedNow();
    }

    // Drag starting on the point: the crease through the point, perpendicular to the segment.
    creaseFromPointToSegment(point, segment) {
        if (this.currentCanvas === '2d') this.command.command(`p2d ${this.id(segment)} ${this.id(point)}`);
        else this.command.command(`p3d ${this.id(segment)} ${this.id(point)}`);
        this.runQueuedNow();
    }

    // Drag starting on the segment: the crease that brings the segment's line onto the point once folded.
    creaseFromSegmentToPoint(segment, point) {
        if (this.currentCanvas === '2d') this.command.command(`parallel2d ${this.id(segment)} ${this.id(point)}`);
        else this.command.command(`parallel3d ${this.id(segment)} ${this.id(point)}`);
        this.runQueuedNow();
    }

    // The only sensible crease between two segments: their bisector.
    creaseTwoSegments(a, b) {
        if (this.currentCanvas === '2d') this.command.command(`b2d ${this.id(a)} ${this.id(b)}`);
        else this.command.command(`b3d ${this.id(a)} ${this.id(b)}`);
        this.runQueuedNow();
    }

    rotatePointIds(axis) {
        const pts = new Set();
        this.model.faces.filter(f => f.select).forEach(f => {
            f.points.forEach(p => pts.add(p));
        });
        if (this.downFace) {
            this.downFace.points.forEach(p => pts.add(p));
        }
        // Axis endpoints don't move when rotating around that axis; excluding them
        // keeps the command's point list honest and avoids floating-point drift
        // from rotating a point that should stay exactly put.
        pts.delete(axis.p1);
        pts.delete(axis.p2);
        return [...pts].map(p => this.id(p));
    }
    // Selected points not rotated are adjusted instead
    adjustPointIds(rotatedIds) {
        const rotated = new Set(rotatedIds);
        return this.model.points
            .filter(p => p.select)
            .map(p => this.id(p))
            .filter(id => !rotated.has(id));
    }
    rotateFaceCommentIds() {
        const faces = new Set(this.model.faces.filter(f => f.select));
        if (this.downFace) faces.add(this.downFace);
        return [...faces].map(f => this.id(f));
    }

    rotatePoints(axis, angle) {
        const pts = this.rotatePointIds(axis);
        const adjustPts = this.adjustPointIds(pts);
        const adjust = adjustPts.length ? ` a ${adjustPts.join(' ')}` : '';
        const faces = this.rotateFaceCommentIds();
        const faceComment = faces.length ? ` // ${faces.join(' ')}` : '';
        this.command.command(`t 1000 r ${this.id(axis)} ${angle} ${pts.join(' ')}${adjust}${faceComment}`);
    }

    // Canvas 2d (flat crease pattern). Overridable per-instance so tests can
    // inject already-resolved {xf, yf} without a real DOM element behind view2d.
    event2d(event) {
        const rect = this.view2d.canvas2d.getBoundingClientRect();
        const canvasX = event.clientX - rect.left;
        const canvasY = event.clientY - rect.top;
        const {scale, xOffset, yOffset} = this.view2d;
        return {
            xf: (canvasX - xOffset) / scale,
            yf: (yOffset - canvasY) / scale,
        };
    }

    // Points, then segments, then faces near xf, yf
    search2d(xf, yf) {
        const scale = this.view2d.scale || 1;
        const pick = this.pickFactor();
        const points = this.model.points.filter(p => Math.abs(p.xf - xf) + Math.abs(p.yf - yf) < pick * 10 / scale);
        const segments = this.model.segments.filter(s => Segment.distance2d(s.p1.xf, s.p1.yf, s.p2.xf, s.p2.yf, xf, yf) < pick * 6 / scale);
        const faces = this.model.faces.filter(f => Face.contains2d(f, xf, yf));
        return {points, segments, faces};
    }

    // Down on flat 2d
    down2d(event) {
        this.currentCanvas = '2d';
        this.setPointerType(event);
        const {xf, yf} = this.event2d(event);
        const {points, segments, faces} = this.search2d(xf, yf);
        this.down(points, segments, faces, xf, -yf); // Note inverse y coordinate (drawing space)
    }
    // Move on flat 2d
    move2d(event) {
        this.currentCanvas = '2d';
        const {xf, yf} = this.event2d(event);
        const {points, segments, faces} = this.search2d(xf, yf);
        this.move(points, segments, faces, xf, -yf);
    }
    // Up on flat 2d
    up2d(event) {
        const {xf, yf} = this.event2d(event);
        const {points, segments, faces} = this.search2d(xf, yf);
        this.up(points, segments, faces);
    }

    // Canvas 3d. Overridable per-instance so tests can inject already-resolved
    // {xCanvas, yCanvas} without a real DOM element behind view3d.
    eventCanvas3d(event) {
        const rect = this.view3d.overlay.getBoundingClientRect();
        return {
            xCanvas: event.clientX - rect.left,
            yCanvas: event.clientY - rect.top,
        };
    }
    // Points, then segments, then faces near xCanvas, yCanvas
    pickFaces3d(xCanvas, yCanvas, contextFace = undefined) {
        let faces = this.model.faces.filter(f =>
            Face.contains3d(f, xCanvas, yCanvas, this.view3d),
        );
        if (contextFace) {
            faces = faces.filter(f =>
                f !== contextFace &&
                this.model.sharedSegments(contextFace, f).length > 0,
            );
        }
        if (this.view3d?.faceDepth) {
            // Folding a flat model routinely stacks faces at the exact same depth
            // (e.g. two layers folded flush): faceDepth alone can't tell them apart,
            // and a stable sort would then always resolve to the same array index.
            // Break exact ties in favor of a face the user already explicitly
            // selected — a stronger signal of intent than creation order.
            faces.sort((a, b) => {
                const d = this.view3d.faceDepth(a) - this.view3d.faceDepth(b);
                if (Math.abs(d) > 1e-6) return d;
                return (b.select ? 1 : 0) - (a.select ? 1 : 0);
            });
        }
        return faces;
    }

    search3d(xCanvas, yCanvas, contextFace = undefined) {
        const pick = this.pickFactor();
        // Points near xCanvas, yCanvas
        const points = this.model.points.filter(p => Math.abs(p.xCanvas - xCanvas) + Math.abs(p.yCanvas - yCanvas) < pick * 10);
        // Segments near xCanvas, yCanvas
        const segments = this.model.segments.filter(s => Segment.distance2d(s.p1.xCanvas, s.p1.yCanvas, s.p2.xCanvas, s.p2.yCanvas, xCanvas, yCanvas) < pick * 6);
        // Faces under cursor: depth-sorted; when contextFace set, adjacent faces only
        const faces = this.pickFaces3d(xCanvas, yCanvas, contextFace);
        return {points, segments, faces};
    }
    // Down on 3d overlay
    down3d(event) {
        this.currentCanvas = '3d';
        this.setPointerType(event);
        const {xCanvas, yCanvas} = this.eventCanvas3d(event);
        const {points, segments, faces} = this.search3d(xCanvas, yCanvas);
        this.orbiting = event.button === 1 || event.shiftKey || (points.length === 0 && segments.length === 0 && faces.length === 0);
        this.down(points, segments, faces, xCanvas, yCanvas);
    }

    // Move on 3d overlay
    move3d(event) {
        this.currentCanvas = '3d';
        const {xCanvas, yCanvas} = this.eventCanvas3d(event);
        const contextFace = this.downFace || undefined;
        const {points, segments, faces} = this.search3d(xCanvas, yCanvas, contextFace);
        // Handle 3d rotation
        if (this.orbiting && event.buttons > 0) {
            // Rotation
            const target = event.target || this.view3d.overlay;
            const factor = 600 / (target.height || 600);
            const dx = factor * (xCanvas - this.currentX);
            const dy = factor * (yCanvas - this.currentY);
            this.view3d.angleX += dy;
            this.view3d.angleY += dx;
        } else if ((event.buttons & 2) > 0) {
            // Translation
            const dx = (xCanvas - this.currentX);
            const dy = (yCanvas - this.currentY);
            this.view3d.translationY -= dy;
            this.view3d.translationX += dx;
        }
        this.move(points, segments, faces, xCanvas, yCanvas);
        this.view3d.initModelView();
        this.view3d.initPerspective();
    }
    // Up on 3d overlay
    up3d(event) {
        const {xCanvas, yCanvas} = this.eventCanvas3d(event);
        const {points, segments, faces} = this.search3d(xCanvas, yCanvas);
        this.up(points, segments, faces);
        if (points.length === 0 && segments.length === 0 && faces.length === 0) {
            this.doubleClick();
        }
    }

    // Mouse wheel on 3d overlay
    wheel(event) {
        this.view3d.scale = event.scale !== undefined
            ? event.scale / 10
            : this.view3d.scale + event.deltaY / 300;
        this.view3d.scale = Math.max(0.2, Math.min(3, this.view3d.scale));
        this.view3d.initModelView();
        this.view3d.initPerspective();
    }

    doubleClick() {
        if (Date.now() - this.touchTime < 400) {
            this.view3d.angleX = this.view3d.angleY = this.view3d.angleZ = 0;
            this.view3d.translationX = this.view3d.translationY = 0;
            this.view3d.scale = 1;
            this.command.command('fit');
        }
        this.touchTime = Date.now();
    }
}



class View2d {

    constructor(model, canvas2d) {
        this.model = model;
        this.canvas2d = canvas2d;

        // Resize
        globalThis.addEventListener('resize', () => {
            this.fit();
            this.drawModel();
        });
    }

    getFaceVerticesCCW(face) {
        return face?.points ?? [];
    }

    // Fit to show all the model in the view
    fit() {
        // Model
        const {xMin, yMin, xMax, yMax} = this.model.get2DBounds();
        const modelWidth = xMax - xMin;
        const modelHeight = yMax - yMin;
        // <div> containing Canvas
        const rect = this.canvas2d.getBoundingClientRect();
        const viewWidth = rect.width;
        const viewHeight = rect.height;
        // Resize canvas2d to fit inside <div>
        this.canvas2d.width = viewWidth - 2 * this.canvas2d.clientLeft;
        this.canvas2d.height = viewHeight - 2 * this.canvas2d.clientTop;
        // Compute scale to fit
        const scale = Math.min(viewWidth / modelWidth, viewHeight / modelHeight) / 1.2;
        // Compute offset to center drawing
        const xOffset = viewWidth / 2;
        const yOffset = viewHeight / 2;
        // Kept so pointer events (Helper) can invert canvas pixels back to xf,yf
        this.scale = scale;
        this.xOffset = xOffset;
        this.yOffset = yOffset;

        const context2d = this.canvas2d.getContext('2d');
        context2d.setTransform(scale, 0, 0, scale, xOffset, yOffset);
    }

    // Draw points
    drawPoints(points) {
        const context2d = this.canvas2d.getContext('2d');
        context2d.font = '18px serif';
        points.forEach(p => {
            const xc = p.xf;
            const yc = -p.yf;
            context2d.beginPath();
            context2d.arc(xc, yc, p.hover ? 12 : 8, 0, 2 * Math.PI);
            context2d.fillStyle = p.select ? 'red' : p.hover ? 'blue' : 'skyblue';
            context2d.fill();

            // label
            context2d.fillStyle = p.hover ? 'white' : 'black';
            const label = String(this.model.points.indexOf(p));
            context2d.fillText(label, xc - 4 * label.length, yc + 5);
        });
    }

    // Draw segments
    drawSegments(segments) {
        const context2d = this.canvas2d.getContext('2d');
        context2d.font = '18px serif';
        context2d.lineWidth = 4;

        segments.forEach(s => {
            const [xf1, yf1, xf2, yf2] = [s.p1.xf, -s.p1.yf, s.p2.xf, -s.p2.yf];
            const [xc, yc] = [(xf1 + xf2) / 2, (yf1 + yf2) / 2];

            context2d.lineWidth = s.hover ? 6 : 3;
            context2d.setLineDash(s.assignment === 'V' ? [8, 6] : s.assignment === 'M' ? [12, 4, 2, 4] : []);
            context2d.beginPath();
            context2d.moveTo(xf1, yf1);
            context2d.lineTo(xf2, yf2);
            context2d.strokeStyle = s.select ? 'red' : s.hover ? 'blue' : 'skyblue';
            context2d.stroke();
            context2d.setLineDash([]);
            // Add an arrow on p2
            const arrowLength = 20;
            const arrowAngle = Math.PI / 7;
            const angle = Math.atan2(yf2 - yf1, xf2 - xf1);
            const [arrowX1, arrowY1] = [xf2 - arrowLength * Math.cos(angle + arrowAngle), yf2 - arrowLength * Math.sin(angle + arrowAngle)];
            const [arrowX2, arrowY2] = [xf2 - arrowLength * Math.cos(angle - arrowAngle), yf2 - arrowLength * Math.sin(angle - arrowAngle)];
            context2d.beginPath();
            context2d.moveTo(xf2, yf2);
            context2d.lineTo(arrowX1, arrowY1);
            context2d.lineTo(arrowX2, arrowY2);
            context2d.closePath();
            context2d.fillStyle = s.select ? 'red' : s.hover ? 'blue' : 'skyblue';
            context2d.fill();

            // Circle with color for selected, bigger for hovered
            context2d.beginPath();
            context2d.arc(xc, yc, s.hover ? 12 : 8, 0, 2 * Math.PI);
            context2d.fillStyle = s.select ? 'red' : s.hover ? 'blue' : 'lightgreen';
            context2d.fill();

            // Label
            context2d.fillStyle = s.hover ? 'white' : 'black';
            const n = this.model.segments.indexOf(s);
            context2d.fillText(String(n), xc - (n < 10 ? 4 : 8), yc + 5);

            // Angle of incident faces if there are 2 faces
            const faces = Model.incidentFaces(this.model, s);
            if (faces.length === 2) {
                const angle = Model.dihedralAngle(faces[0], faces[1]);
                const angleStr = String(angle);
                context2d.fillStyle = 'black';
                context2d.fillText(angleStr, xc - 4 * angleStr.length, yc + 22);
            }
        });
    }

    drawFaces(faces) {
        const context2d = this.canvas2d.getContext('2d');
        context2d.font = '18px serif';
        context2d.strokeStyle = 'black';

        faces.forEach(f => {
            const pts = this.getFaceVerticesCCW(f);
            if (!pts || pts.length === 0) return;
            let [cx, cy] = [pts[0].xf, -pts[0].yf];
            context2d.beginPath();
            context2d.moveTo(pts[0].xf, -pts[0].yf);
            for (let i = 1; i < pts.length; i++) {
                const p = pts[i];
                context2d.lineTo(p.xf, -p.yf);
                cx += p.xf;
                cy += -p.yf;
            }
            context2d.closePath();
            context2d.fillStyle = f.hover ? 'lightcyan' : f.select ? 'pink' : 'lightblue';
            context2d.fill();

            cx /= pts.length;
            cy /= pts.length;
            context2d.beginPath();
            context2d.arc(cx, cy, 12, 0, 2 * Math.PI);
            context2d.fillStyle = 'lightcyan';
            context2d.fill();
            // Label
            context2d.fillStyle = 'black';
            const n = this.model.faces.indexOf(f);
            context2d.fillText(String(n), cx - (n < 10 ? 4 : 8), cy + 5);

            // Normal (+ or -)
            const normal = Model.normal(f);
            const sign = normal[2] >= 0 ? '+' : '-';
            context2d.fillText(sign, cx - 4, cy + 22);
        });
    }

    drawModel() {
        if (this.model.faces.length === 1) { this.fit();}
        const context2d = this.canvas2d.getContext('2d');
        context2d.save();
        context2d.setTransform(1, 0, 0, 1, 0, 0);
        context2d.fillStyle = '#CCE4FF';
        context2d.fillRect(0, 0, this.canvas2d.width, this.canvas2d.height);
        context2d.restore();

        this.drawFaces(this.model.faces);
        this.drawSegments(this.model.segments);
        this.drawPoints(this.model.points);
    }
}
